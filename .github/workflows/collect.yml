name: Collect and publish
run-name: UA matrix for ${{ inputs.version || 'new stable Codex versions' }}

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact stable Codex version, for example 0.156.1; blank discovers new versions'
        required: false
        type: string

# Serialize discovery through publication so two runs cannot publish the same version.
concurrency:
  group: ua-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.discover.outputs.needed }}
      version: ${{ steps.discover.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Discover a version to collect
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: >-
          python scripts/releases.py discover
          --repository "$GITHUB_REPOSITORY"
          --version "$REQUESTED_VERSION"
      - name: Resolve stable terminal releases
        if: steps.discover.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/terminals.py resolve --output .local/terminal-releases.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.discover.outputs.needed == 'true'
        with:
          name: terminal-releases
          path: .local/terminal-releases.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  collect:
    needs: discover
    if: needs.discover.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-ubuntu-x64
            runner: ubuntu-24.04
          - platform: linux-ubuntu-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-debian-x64
            runner: ubuntu-24.04
            container_image: debian:13-slim
          - platform: linux-debian-arm64
            runner: ubuntu-24.04-arm
            container_image: debian:13-slim
          - platform: linux-fedora-x64
            runner: ubuntu-24.04
            container_image: fedora:44
          - platform: linux-fedora-arm64
            runner: ubuntu-24.04-arm
            container_image: fedora:44
          - platform: linux-alpine-x64
            runner: ubuntu-24.04
            container_image: alpine:3.24
          - platform: linux-alpine-arm64
            runner: ubuntu-24.04-arm
            container_image: alpine:3.24
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
          - platform: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-releases
          path: .local
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: ${{ !matrix.container_image }}
        with:
          python-version: '3.13'
      - name: Install Windows terminal support
        if: startsWith(matrix.platform, 'windows-')
        run: python -m pip install -r requirements.txt
      - name: Install Linux desktop terminal dependencies
        if: startsWith(matrix.platform, 'linux-') && !matrix.container_image
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - name: Collect native client UAs
        if: ${{ !matrix.container_image }}
        env:
          CODEX_VERSION: ${{ needs.discover.outputs.version }}
          COLLECT_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: >-
          python scripts/collect.py
          --version "$CODEX_VERSION"
          --platform "$COLLECT_PLATFORM"
          --terminal-releases .local/terminal-releases.json
          --output ".local/$COLLECT_PLATFORM.json"
      - name: Collect Linux distribution UAs
        if: ${{ matrix.container_image }}
        env:
          CODEX_VERSION: ${{ needs.discover.outputs.version }}
          COLLECT_PLATFORM: ${{ matrix.platform }}
          COLLECT_CONTAINER_IMAGE: ${{ matrix.container_image }}
        shell: bash
        run: |
          mkdir -p .local
          docker run --rm \
            --env CODEX_VERSION --env COLLECT_PLATFORM --env COLLECT_CONTAINER_IMAGE \
            --env RUNNER_NAME --env ImageOS --env ImageVersion \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/.local,target=/output" \
            --workdir /workspace "$COLLECT_CONTAINER_IMAGE" sh -ec '
              case "$COLLECT_PLATFORM" in
                linux-debian-*) apt-get update && apt-get install -y --no-install-recommends python3 ca-certificates ;;
                linux-fedora-*) dnf install -y python3 ca-certificates ;;
                linux-alpine-*) apk add --no-cache python3 ca-certificates ;;
              esac
              python3 scripts/collect.py \
                --version "$CODEX_VERSION" \
                --platform "$COLLECT_PLATFORM" \
                --terminal-releases /workspace/.local/terminal-releases.json \
                --output "/output/$COLLECT_PLATFORM.json"
            '
      - name: Install Ubuntu in WSL
        if: startsWith(matrix.platform, 'windows-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ matrix.platform }}' -eq 'windows-arm64') {
            Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Windows-Subsystem-Linux -NoRestart
            $release = gh api repos/microsoft/WSL/releases/latest | ConvertFrom-Json
            $assets = @($release.assets | Where-Object name -Match '^wsl\..*\.arm64\.msi$')
            if ($assets.Count -ne 1) { throw "Expected one official ARM64 WSL installer" }
            $installer = Join-Path $env:RUNNER_TEMP wsl.arm64.msi
            Invoke-WebRequest $assets[0].browser_download_url -OutFile $installer
            $install = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait -PassThru
            if ($install.ExitCode -notin 0,3010) { throw "WSL installer failed: $($install.ExitCode)" }
          }
          wsl --install --distribution Ubuntu-24.04 --web-download --no-launch --version 1
          if ($LASTEXITCODE -ne 0) { throw "Ubuntu WSL installation failed: $LASTEXITCODE" }
          wsl --distribution Ubuntu-24.04 --user root --exec sh -ec 'apt-get update && apt-get install -y --no-install-recommends python3 ca-certificates'
          if ($LASTEXITCODE -ne 0) { throw "Ubuntu WSL preparation failed: $LASTEXITCODE" }
      - name: Collect Ubuntu WindowsTerminal Profile through WSL
        if: startsWith(matrix.platform, 'windows-')
        env:
          CODEX_VERSION: ${{ needs.discover.outputs.version }}
          COLLECT_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: >-
          python scripts/wsl.py collect
          --version "$CODEX_VERSION"
          --platform "linux-ubuntu-${COLLECT_PLATFORM#windows-}"
          --terminal-releases .local/terminal-releases.json
          --output ".local/wsl-linux-ubuntu-${COLLECT_PLATFORM#windows-}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-${{ matrix.platform }}
          path: |
            .local/${{ matrix.platform }}.json
            .local/wsl-linux-ubuntu-*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  publish:
    needs: [discover, collect]
    if: needs.discover.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: platform-*
          path: .local/records
          merge-multiple: true
      - name: Assemble the matrix and run details
        env:
          CODEX_VERSION: ${{ needs.discover.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: >-
          python scripts/matrix.py
          --version "$CODEX_VERSION"
          --input-dir .local/records
          --output-dir .local
          --collector-commit "$GITHUB_SHA"
          --run-url "$RUN_URL"
          --require-profiles
      - name: Publish the versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_VERSION: ${{ needs.discover.outputs.version }}
        run: >-
          python scripts/releases.py publish
          --repository "$GITHUB_REPOSITORY"
          --version "$CODEX_VERSION"
          --matrix .local/ua-matrix.json
          --run .local/ua-matrix.run.json
          --collector-commit "$GITHUB_SHA"
